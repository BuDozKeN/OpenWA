# Da_Support fork: build and publish the OpenWA image from this fork on our own tag pattern.
# Upstream's release.yml (tags v*) also runs SDK releases, Docker Hub promotion and smoke jobs that
# need secrets this fork does not have, so we use a separate `dasupport-*` tag namespace and a
# minimal build+push. The image is consumed by the Da_Support Coolify stack.
name: Fork image

on:
  push:
    tags: ['dasupport-*']
  workflow_dispatch:

env:
  DOCKER_PLATFORMS: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push ghcr image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        id: ref
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "image=ghcr.io/${REPO,,}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${REPO,,}:dasupport-latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.latest }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: production
